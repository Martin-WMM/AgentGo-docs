name: Clean up short-lived branches

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-feature-fix:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged feature or fix branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          case "$HEAD_BRANCH" in
            feature/*|fix/*)
              gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$HEAD_BRANCH"
              ;;
            release/*|main|deploy)
              echo "Retaining protected or generated branch: $HEAD_BRANCH"
              ;;
            *)
              echo "No automatic deletion policy for: $HEAD_BRANCH"
              ;;
          esac
