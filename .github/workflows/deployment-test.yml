name: Deployment TEST

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: agentgo-docs-test-deployment
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/martin-wmm/agentgo-docs
  IMAGE_TAG: ${{ github.sha }}

jobs:
  validate-ref:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != release/* ]]; then
            {
              echo "## AgentGo Docs Deployment"
              echo
              echo "- Environment: TEST"
              echo "- Status: blocked"
              echo "- Reason: Deployment TEST can only run from a release/* branch."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Deployment TEST can only run from a release/* branch; received $GITHUB_REF_NAME."
            exit 1
          fi

  deploy:
    name: Build and deploy to TEST
    needs: validate-ref
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v4

      - name: Check whether the image exists in GHCR
        id: image-check
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          if docker manifest inspect "$IMAGE_NAME:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists in GHCR; build and push will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist in GHCR; build and push will run."
          fi

      - name: Build and publish Docker image
        id: publish
        if: steps.image-check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag "$IMAGE_NAME:$IMAGE_TAG" .
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Prepare deployment SSH credentials
        id: ssh
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/agentgo-docs-deploy-key"
          known_hosts_file="$RUNNER_TEMP/agentgo-docs-known-hosts"
          install -m 600 /dev/null "$key_file"
          install -m 600 /dev/null "$known_hosts_file"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known_hosts_file"
          {
            echo "key_file=$key_file"
            echo "known_hosts_file=$known_hosts_file"
          } >> "$GITHUB_OUTPUT"

      - name: Sync TEST deployment files
        id: upload
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$KEY_FILE" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          mkdir -p "$DEPLOY_PATH/agentgo-docs-deployment"
          if [[ ! -s "$DEPLOY_PATH/docker-compose.yml" ]]; then
            printf '%s\n' \
              'include:' \
              '  - path: ./agentgo-docs-deployment/docker-compose-agentgo-docs.yml' \
              > "$DEPLOY_PATH/docker-compose.yml"
          elif ! grep -Fqx '  - path: ./agentgo-docs-deployment/docker-compose-agentgo-docs.yml' "$DEPLOY_PATH/docker-compose.yml"; then
            echo "The shared AgentGo Compose file does not include AgentGo Docs; refusing to overwrite it." >&2
            exit 1
          fi
          REMOTE_SCRIPT
          rsync -az --delete -e "ssh -i $KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$KNOWN_HOSTS_FILE" \
            agentgo-docs-deployment/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/agentgo-docs-deployment/"

      - name: Check whether the image exists on TEST server
        id: server-image-check
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$KEY_FILE" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          if ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker image inspect '$IMAGE_NAME:$IMAGE_TAG' > /dev/null 2>&1"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists on the TEST server; pull will be skipped."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image is not on the TEST server; pull will run."
          fi

      - name: Pull image and start TEST service
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_IMAGE_EXISTS: ${{ steps.server-image-check.outputs.exists }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$KEY_FILE" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          if [[ "$SERVER_IMAGE_EXISTS" != "true" ]]; then
            printf '%s' "$GHCR_TOKEN" | ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"
          fi
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' SERVER_IMAGE_EXISTS='$SERVER_IMAGE_EXISTS' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          touch .env
          chmod 600 .env
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG" >> .env
          fi
          if [[ "$SERVER_IMAGE_EXISTS" != "true" ]]; then
            docker compose pull agentgo-docs
          fi
          docker compose up -d agentgo-docs
          REMOTE_SCRIPT

      - name: Verify TEST deployment
        id: verify
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail
          ssh_options=(-i "$KEY_FILE" -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KNOWN_HOSTS_FILE")
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test "$(docker inspect -f '{{.State.Running}}' agentgo-docs)" = "true"
          curl --fail --silent --show-error http://127.0.0.1:20080/ > /dev/null
          REMOTE_SCRIPT

      - name: Write deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AgentGo Docs Deployment"
            echo
            echo "- Environment: TEST"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Image: $IMAGE_NAME:$IMAGE_TAG"
            echo "- GHCR image check: ${{ steps.image-check.outcome }}"
            echo "- Publish image: ${{ steps.publish.outcome }}"
            echo "- Sync deployment files: ${{ steps.upload.outcome }}"
            echo "- TEST server image check: ${{ steps.server-image-check.outcome }}"
            echo "- Start service: ${{ steps.deploy.outcome }}"
            echo "- Health check: ${{ steps.verify.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.image-check.outcome }}" != "success" || ( "${{ steps.publish.outcome }}" != "success" && "${{ steps.publish.outcome }}" != "skipped" ) || "${{ steps.upload.outcome }}" != "success" || "${{ steps.server-image-check.outcome }}" != "success" || "${{ steps.deploy.outcome }}" != "success" || "${{ steps.verify.outcome }}" != "success" ]]; then
            exit 1
          fi
