name: Issue-first policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  issue-reference:
    name: Require linked issue
    runs-on: ubuntu-latest
    steps:
      - name: Check pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PR_BODY" =~ (close[sd]?|fix(e[sd])?|resolve[sd]?|ref(erence[sd]?)?|related[[:space:]]+to)[[:space:]]+#[0-9]+ ]]; then
            echo "Every pull request must reference a GitHub Issue, for example: Closes #123."
            exit 1
          fi
