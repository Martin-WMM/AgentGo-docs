name: Publish Docker image

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: docs-${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE,,}"
          docker build --tag "$image:$VERSION" --tag "$image:latest" .
          docker push "$image:$VERSION"
          docker push "$image:latest"
          docker save "$image:$VERSION" | gzip > "agentgo-docs-$VERSION.tar.gz"

      - name: Create GitHub Release and upload image asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: docs-${{ github.event.pull_request.merge_commit_sha }}
          IMAGE_ARCHIVE: agentgo-docs-docs-${{ github.event.pull_request.merge_commit_sha }}.tar.gz
          REPOSITORY: ${{ github.repository }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$IMAGE_ARCHIVE" \
            --repo "$REPOSITORY" \
            --target "$MERGE_SHA" \
            --title "AgentGo Docs $RELEASE_TAG" \
            --generate-notes
