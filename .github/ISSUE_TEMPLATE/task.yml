name: Task
description: Track a planned implementation or maintenance task.
title: "[Task]: "
labels:
  - "type: chore"
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this task deliver?
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add relevant background, constraints, links, or affected areas.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be true for this issue to be complete.
      placeholder: |
        - [ ] ...
    validations:
      required: true
